<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css" />
    <title>Login - eTrader</title>
    <style>
        body { padding-top: 60px; background: #f7f7f7; }
        .login-card { max-width: 420px; margin: 40px auto; padding: 24px; background: #fff; border: 1px solid #ddd; border-radius: 6px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand" href="openredirect_web.html">eTrader</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="login-card">
            <h3 class="text-center"><img src="stopanska-banka-logo-png_seeklogo-132577.png" alt="Logo" style="height:36px; display:inline-block; margin-right:8px; vertical-align:middle;">Firecompass POC</h3>
            <h3 class="text-center">Sign in to eTrader</h3>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter username" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Password" required />
                </div>
                <div class="checkbox">
                    <label><input type="checkbox" id="remember" /> Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>

            <div id="message" class="alert" style="display:none; margin-top:15px;"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
    <script>
        (function(){
            var form = document.getElementById('loginForm');
            var msg = document.getElementById('message');
            form.addEventListener('submit', function(e){
                e.preventDefault();
                var user = document.getElementById('username').value.trim();
                var pass = document.getElementById('password').value;

                // Simple demo authentication (client-side only)
                if(user === 'admin' && pass === 'password'){
                    msg.style.display = 'block';
                    msg.className = 'alert alert-success';
                    msg.textContent = 'Login successful — redirecting...';
                    // Redirect to the main page after a short delay
                    setTimeout(function(){ window.location.href = 'openredirect_web.html'; }, 900);
                } else {
                    msg.style.display = 'block';
                    msg.className = 'alert alert-danger';
                    msg.textContent = 'Invalid credentials (demo). Try admin / password.';
                }
            });
        })();
    </script>
</body>
</html>
